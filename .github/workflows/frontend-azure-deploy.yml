name: Frontend Azure Deploy

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Frontend CI workflow run number to deploy (leave blank for latest successful)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download specific run artifact
        if: github.event.inputs.run_number != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: frontend-ci.yml
          run_number: ${{ github.event.inputs.run_number }}
          name: frontend-dist
          path: dist

      - name: Download latest successful artifact
        if: github.event.inputs.run_number == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: frontend-ci.yml
          workflow_conclusion: success
          name: frontend-dist
          path: dist

      - name: List downloaded files
        run: ls -R dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          skip_app_build: true
          app_location: 'dist'

      - name: Output deployment URL
        run: echo "Frontend deployed from run number '${{ github.event.inputs.run_number != '' && github.event.inputs.run_number || 'latest' }}'"
